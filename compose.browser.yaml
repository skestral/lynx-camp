# Standalone qualification workspace; does not start or reconfigure Camp Finder.
name: campfinder-browser
services:
  browser:
    build:
      context: .
      dockerfile: browser_worker/Dockerfile
    image: lynx-camp-browser:local
    ports:
      - "127.0.0.1:${CAMPFINDER_BROWSER_PORT:-6080}:6080"
    environment:
      CAMPFINDER_BROWSER_PASSWORD: ${CAMPFINDER_BROWSER_PASSWORD:?Set a separate browser-console password of at least 16 characters}
    volumes:
      - browser-profile:/profile
    tmpfs:
      - /run/campfinder:uid=1001,gid=1001,mode=0700
      - /tmp:mode=1777
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
      - seccomp=browser_worker/seccomp_profile.json
    cap_drop:
      - ALL
    restart: "no"
volumes:
  browser-profile:
